name: Quant Monitor Backup

on:
  schedule:
    - cron: '37 1 * * 1-5'
    - cron: '7,37 2,3,5,6 * * 1-5'
    - cron: '7 7 * * 1-5'
    - cron: '12 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: quant-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check trading day
        id: trading_day
        run: |
          if python -c "import quant_resonance_monitor as q; import sys; sys.exit(0 if q.is_trading_day() else 1)"; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
            echo "Today is not an A-share trading day, skipping."
          fi
      - name: Run monitor
        if: steps.trading_day.outputs.trading == 'true'
        run: python generate_report.py
      - name: Commit report and data
        if: steps.trading_day.outputs.trading == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add report/index.html monitor_data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Monitor update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase || {
              echo "Rebase conflict, keeping the newly generated report"
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add report/index.html monitor_data/
              if git diff --cached --quiet; then
                echo "No changes after rebase, already up to date"
              else
                git commit -m "Monitor update $(date -u '+%Y-%m-%d %H:%M UTC')"
              fi
            }
            git push
          fi
